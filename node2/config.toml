[WebServer]
AllowOrigins = "*"
SecureCookies = false
HTTPPort = 6688

[WebServer.TLS]
HTTPSPort = 0

[Log]
Level = "info"

[[EVM]]
ChainID = 31337
Enabled = true

[[EVM.Nodes]]
Name = "hardhat"
WSURL = "ws://host.docker.internal:7545"
HTTPURL = "http://host.docker.internal:7545"

[EVM.Transactions]
MaxInFlight = 50
MaxQueued = 1000
ReaperInterval = '1h'
ReaperThreshold = '168h'
ResendAfterThreshold = '1m'

[Feature]
LogPoller = true










