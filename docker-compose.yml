version: '3.7'

services:
  postgres:
    image: postgres:15
    container_name: chainlink_postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: chainlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  chainlink:
    image: smartcontract/chainlink:1.13.0
    container_name: chainlink_node
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ROOT=/chainlink
      - LOG_LEVEL=debug
      - ETH_CHAIN_ID=5777
      - MIN_OUTGOING_CONFIRMATIONS=1
      - LINK_CONTRACT_ADDRESS=0x0000000000000000000000000000000000000000
      - CHAINLINK_TLS_PORT=0
      - SECURE_COOKIES=false
      - ALLOW_ORIGINS=*
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/chainlink?sslmode=disable
      - ETH_URL=http://host.docker.internal:8545
    ports:
      - "6688:6688"
    volumes:
      - ./chainlink-data:/chainlink
      - ./chainlink-password.txt:/chainlink/.password:ro
      - ./chainlink-api.txt:/chainlink/.api:ro
    command: node start --password /chainlink/.password --api /chainlink/.api
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
