version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cl-postgres
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  chainlink:
    image: chainlink-local
    container_name: chainlink-node
    depends_on:
      - postgres
    env_file: .env
    command: ["local", "n", "-p", "/chainlink/.password", "-a", "/chainlink/.api"]
    volumes:
      - ./chainlink-data:/chainlink
    ports:
      - "6688:6688"

networks:
  chainlink-local:
    driver: bridge

volumes:
  pgdata: