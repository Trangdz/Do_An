version: '3.8'

services:
  # MongoDB Local (Optional - for development)
  mongodb:
    image: mongo:7.0
    container_name: lendhub-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: lendhub
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - lendhub-network
    profiles:
      - local

  # MongoDB Admin UI
  mongo-express:
    image: mongo-express:1.0.0
    container_name: lendhub-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - lendhub-network
    profiles:
      - local

  # LendHub Indexer
  indexer:
    build: ./indexer
    container_name: lendhub-indexer
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/lendhub
      RPC_URL: http://host.docker.internal:8545
      LENDING_POOL_ADDRESS: ${LENDING_POOL_ADDRESS}
      ORACLE_ADDRESS: ${ORACLE_ADDRESS}
    depends_on:
      - mongodb
    networks:
      - lendhub-network
    restart: unless-stopped

  # Frontend
  frontend:
    build: ./lendhub-frontend-nextjs
    container_name: lendhub-frontend
    ports:
      - "3001:3000"
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/lendhub
      NEXT_PUBLIC_RPC_URL: http://host.docker.internal:8545
    depends_on:
      - mongodb
    networks:
      - lendhub-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  lendhub-network:
    driver: bridge




