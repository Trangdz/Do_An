version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: chainlink_postgres
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  chainlink:
    image: smartcontract/chainlink:1.13.0
    container_name: chainlink_node
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres?sslmode=disable
      - ETH_URL=ws://192.168.34.106:8545
      - ETH_HTTP_URL=http://192.168.34.106:8545
      - ETH_WS_URL=ws://192.168.34.106:8545
      - ETH_CHAIN_ID=5777
      - LOG_LEVEL=debug
      - LINK_CONTRACT_ADDRESS=0x0000000000000000000000000000000000000000
      - CHAINLINK_TLS_PORT=0
      - SECURE_COOKIES=false
    volumes:
      - ./chainlink-data:/chainlink
      - ./chainlink-password.txt:/chainlink/.password:ro
      - ./chainlink-api.txt:/chainlink/.api:ro
    ports:
      - "6688:6688"
    command: ["local", "n", "-p", "/chainlink/.password", "-a", "/chainlink/.api"]
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  chainlink-local:
    driver: bridge

volumes:
  pgdata:
