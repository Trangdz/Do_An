type = "cron"
schemaVersion = 1
name = "DAI/USD Price v2"
forwardingAllowed = false
maxTaskDuration = "0s"
schedule = "@every 30s"
observationSource = """
fetch    [type="http" method="GET" url="https://api.binance.com/api/v3/ticker/price?symbol=USDTDAI" allowUnrestrictedNetworkAccess=true]\n
parse    [type="jsonparse" path="price" data="$(fetch)"]\n
multiply_parse [type="multiply" input="$(parse)" times=100000000]\n
divide   [type="divide" input="100000000000000000" divisor="$(multiply_parse)"]\n
multiply_round [type="multiply" input="$(divide)" times=100000000]\n
divide_final [type="divide" input="$(multiply_round)" divisor="100000000000000000"]\n
encode   [type="ethabiencode" abi="updatePrice(string symbol, int256 price)" data="{\\\"symbol\\\": \\\"DAI\\\", \\\"price\\\": $(divide_final)}"]\n
submit   [type="ethtx" to="0x33891f1fDA4555b733473D34EEF02cAd458db9a3" data="$(encode)" gasLimit="500000"]\n
fetch->parse->multiply_parse->divide->multiply_round->divide_final->encode->submit
"""
