[WebServer]
AllowOrigins = "*"
SecureCookies = false
HTTPPort = 6688

[WebServer.TLS]
HTTPSPort = 0

[Log]
Level = "debug"   # giá trị cuối ghi đè, nên lấy debug

[[EVM]]
ChainID = 1337
Enabled = true

[[EVM.Nodes]]
Name   = "ganache"
WSURL  = "ws://host.docker.internal:7545"
HTTPURL = "http://host.docker.internal:7545"

[EVM.Transactions]
MaxInFlight = 500
MaxQueued = 1000
ReaperInterval = '1h'
ReaperThreshold = '168h'
ResendAfterThreshold = '1m'

# Nếu app KHÔNG cho phép WSURL, HTTPURL, ChainID trong Feature → phải xóa
[Feature]
LogPoller = true
